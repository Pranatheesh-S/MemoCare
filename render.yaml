databases:
  - name: smritisetu-db
    plan: free
    databaseName: smritisetu
    user: smritisetu_user

services:
  - type: web
    name: memocare-backend-api
    env: node
    plan: free
    rootDir: smritisetu-ai
    buildCommand: npm install --include=dev && npm run build:types && npm run db:generate -w @smritisetu/backend-api && npm run build:backend
    startCommand: npm run db:deploy -w @smritisetu/backend-api && npm run start -w @smritisetu/backend-api
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smritisetu-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 4000

  - type: web
    name: memocare-ml-service
    env: python
    plan: free
    rootDir: smritisetu-ai/services/ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHON_VERSION
        value: 3.12.0
